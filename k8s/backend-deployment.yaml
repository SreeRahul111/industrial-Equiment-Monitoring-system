apiVersion: apps/v1
kind: Deployment
metadata:
  name: iems-backend
  namespace: iems-production
  labels:
    app.kubernetes.io/name: iems-backend
    app.kubernetes.io/part-of: iems
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: iems-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iems-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ghcr.io/org/iems-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: iems-config
            - secretRef:
                name: iems-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/readiness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
