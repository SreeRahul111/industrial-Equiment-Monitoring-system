apiVersion: apps/v1
kind: Deployment
metadata:
  name: iems-frontend
  namespace: iems-production
  labels:
    app.kubernetes.io/name: iems-frontend
    app.kubernetes.io/part-of: iems
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: iems-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iems-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/org/iems-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
